<svg width="460" height="120" viewBox="0 0 460 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo TAPERP">
  <defs>
    <!-- Gradientes isotipo -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#003B73"/> <!-- azul profundo -->
      <stop offset="100%" stop-color="#00A6A6"/> <!-- teal -->
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#F4B942"/> <!-- dorado -->
      <stop offset="100%" stop-color="#00A6A6"/> <!-- teal -->
    </linearGradient>

    <!-- Gradiente texto TAP (azul dominante) -->
    <linearGradient id="gradTap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003B73"/>
      <stop offset="100%" stop-color="#0096D6"/>
    </linearGradient>

    <!-- Gradiente texto ERP (verde dominante) -->
    <linearGradient id="gradErp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009E73"/>
      <stop offset="100%" stop-color="#00C497"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity=".15"/>
    </filter>

    <style>
      .word {
        font: 800 46px/1.1 'Poppins', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Isotipo -->
  <g transform="translate(16,17)" filter="url(#soft)">
    <rect x="0" y="0" rx="18" ry="18" width="86" height="86" fill="#ffffff" fill-opacity=".95"/>
    <path d="M12,72 C18,48 40,26 72,18" fill="none" stroke="url(#g1)" stroke-width="10" stroke-linecap="round"/>
    <path d="M12,16 C36,28 58,50 74,74" fill="none" stroke="url(#g2)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="44" cy="44" r="10" fill="#ffffff"/>
    <circle cx="44" cy="44" r="7" fill="url(#g1)"/>
  </g>

  <!-- Texto TAPERP (azul → verde, sin separación visual) -->
  <g transform="translate(120,33)">
    <text class="word" x="0" y="54">
      <tspan fill="url(#gradTap)">TAP</tspan>
      <tspan fill="url(#gradErp)">ERP</tspan>
    </text>
  </g>
</svg>
