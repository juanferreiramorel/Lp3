services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      # Volúmenes nombrados para caché - mejora rendimiento en Windows
      - vendor_cache:/var/www/html/vendor
      - bootstrap_cache:/var/www/html/bootstrap/cache
      # Volumen para vistas compiladas - evita problemas de permisos al editar
      - views_cache:/var/www/html/storage/framework/views
    networks:
      - laravel
    ports:
      - "8000:80"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432

  db:
    image: postgres:9.5.11
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lp2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    networks:
      - laravel
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laravel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - laravel
    depends_on:
      - db

  # Chromium behind an HTTP API: prints contracts so the PDF matches the
  # editor. Not published to the host; the app reaches it as gotenberg:3000.
  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    container_name: laravel_gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-deny-private-ips=true
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  # Volúmenes de caché para mejor rendimiento
  vendor_cache:
    driver: local
  bootstrap_cache:
    driver: local
  views_cache:
    driver: local
