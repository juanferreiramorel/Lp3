services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      # Volúmenes nombrados para caché - mejora rendimiento en Windows
      - vendor_cache:/var/www/html/vendor
      - storage_framework:/var/www/html/storage/framework
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - laravel
    ports:
      - "8000:80"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db

  db:
    image: postgres:9.5.11
    container_name: laravel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lp2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - ./docker/postgres_data:/var/lib/postgresql/data
    networks:
      - laravel
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laravel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - laravel
    depends_on:
      - db

networks:
  laravel:
    driver: bridge

volumes:
  # Volúmenes de caché para mejor rendimiento
  vendor_cache:
    driver: local
  storage_framework:
    driver: local
  bootstrap_cache:
    driver: local
