; PHP-FPM Pool Configuration - OPTIMIZED for Performance
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dynamic process management para mejor uso de recursos
pm = dynamic

; Máximo de procesos hijo (ajustar según RAM disponible)
; Fórmula: (RAM total - RAM para otros servicios) / RAM por proceso PHP
pm.max_children = 20

; Procesos iniciales al arrancar (1/4 de max_children)
pm.start_servers = 5

; Mínimo de procesos en espera
pm.min_spare_servers = 3

; Máximo de procesos en espera
pm.max_spare_servers = 10

; Requests antes de reciclar worker (previene memory leaks)
pm.max_requests = 500

; Timeout para requests lentos (logging)
request_slowlog_timeout = 5s
slowlog = /var/www/html/storage/logs/php-slow.log

; Status page para monitoring (opcional)
pm.status_path = /fpm-status

; Captura de errores
catch_workers_output = yes
decorate_workers_output = no

; Clear environment variables
clear_env = no
