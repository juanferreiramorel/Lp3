; Configuración de subida de archivos
upload_max_filesize=100M
post_max_size=100M
max_file_uploads=20

; Configuración de memoria y tiempo
memory_limit=512M
max_execution_time=300
max_input_time=300

; Configuración de sesiones
session.save_path=/var/www/html/storage/framework/sessions

; Timezone
date.timezone=America/Argentina/Buenos_Aires

; Logs de errores
log_errors=On
error_log=/var/www/html/storage/logs/php-errors.log

; Variables de entrada
max_input_vars=3000

; Buffering
output_buffering=4096

; OPCache Settings (PERFORMANCE OPTIMIZED)
[opcache]
opcache.enable=1
opcache.enable_cli=1
; Revalidar cada 60 segundos (balance entre desarrollo y performance)
; Cambiar a 0 para producción pura
opcache.revalidate_freq=60
opcache.validate_timestamps=1
opcache.max_accelerated_files=20000
opcache.memory_consumption=256
opcache.max_wasted_percentage=10
opcache.interned_strings_buffer=32
opcache.fast_shutdown=1
opcache.save_comments=1
opcache.preload_user=www-data

; Realpath Cache - CRÍTICO para Docker en Windows
; Reduce las llamadas al sistema de archivos
realpath_cache_size=4096K
realpath_cache_ttl=600
