server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /var/www/html/public;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # nginx has no mapping for .webmanifest, so it falls back to
    # application/octet-stream. A `types` block here would REPLACE the whole
    # inherited mime map rather than extend it, so the type is set for this one
    # location instead.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The worker must not be cached, or a stale one keeps controlling the app.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # =====================================================
    # OPTIMIZACIONES DE RENDIMIENTO
    # =====================================================

    # Gzip Compression - reduce tamaño de respuestas
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # Buffer sizes para respuestas grandes
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Timeouts optimizados
    fastcgi_read_timeout 300;
    proxy_read_timeout 300;

    # =====================================================
    # CACHE DE ARCHIVOS ESTÁTICOS
    # =====================================================
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # =====================================================
    # RUTAS PRINCIPALES
    # =====================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # =====================================================
    # PHP-FPM CON BUFFERS OPTIMIZADOS
    # =====================================================
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # nginx >= 1.26 sets HTTP_HOST to $host, which drops the client port.
        # Laravel builds absolute URLs from HTTP_HOST, so route('login') would
        # render http://localhost/login instead of http://localhost:8000/login.
        # Restore the full Host header (dev container bound to localhost only).
        fastcgi_param HTTP_HOST $http_host;

        # Buffers optimizados para reducir I/O
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Cache de conexiones FastCGI
        fastcgi_keep_conn on;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
