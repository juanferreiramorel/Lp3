<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0284c7">
    <title>Sin conexión · TAP ERP</title>
    <!--
        Standalone offline fallback. It cannot depend on public/css/theme.css —
        that stylesheet may not be in the cache — so the token values are
        inlined here to match the product's light theme.
    -->
    <style>
        :root {
            --paper: #f4f4f5;
            --paper-raised: #fcfcfd;
            --ink: #18181b;
            --ink-muted: #52525b;
            --rule: #e4e4e7;
            --stamp: #0284c7;
            --stamp-strong: #0369a1;
            --stamp-on: #ffffff;
            --radius-lg: 10px;
            color-scheme: light;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background-color: var(--paper-raised);
            border: 1px solid var(--rule);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .mark {
            width: 48px;
            height: 48px;
            display: block;
            margin: 0 auto 20px;
            color: var(--stamp);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0;
            color: var(--ink-muted);
            font-size: 15px;
        }

        .hint {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--rule);
            font-size: 13px;
        }

        .retry {
            margin-top: 24px;
            display: inline-block;
            padding: 9px 20px;
            border: 0;
            border-radius: 8px;
            background-color: var(--stamp);
            color: var(--stamp-on);
            font: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 150ms cubic-bezier(0.2, 0, 0, 1);
        }

        .retry:hover,
        .retry:focus-visible { background-color: var(--stamp-strong); }

        .retry:focus-visible {
            outline: 2px solid var(--stamp);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .retry { transition: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="TAP ERP" focusable="false">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <path d="M9 7h14v15l-2.333 2-2.333-2-2.334 2-2.333-2-2.334 2L9 22z" fill="#fcfcfd"/>
            <rect x="12" y="11" width="8" height="1.7" rx="0.85" fill="currentColor"/>
            <rect x="12" y="14.8" width="5.4" height="1.7" rx="0.85" fill="currentColor"/>
        </svg>

        <h1>Sin conexión</h1>
        <p>No se pudo conectar con el servidor. La página se cargará de nuevo cuando vuelva la conexión.</p>

        <button class="retry" type="button" onclick="location.reload()">Reintentar</button>

        <p class="hint">Revisá el wifi o los datos del dispositivo. Los datos no guardados no se enviaron.</p>
    </main>

    <script>
        // Reload on its own as soon as the browser reports the network is back.
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
